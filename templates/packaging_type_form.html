{% extends "base.html" %}

{% block title %}Добавить тип фасовки{% endblock %}

{% block content %}
<h1>Добавить тип фасовки</h1>

<form method="post" action="/packaging-types/new" style="margin-top: 20px;">
    <div class="form-grid">
        <div class="form-group">
            <label>Название</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Код</label>
            <input type="text" name="code">
        </div>

        <div class="form-group">
            <label>Вместимость</label>
            <input type="number" step="0.001" name="capacity_value">
        </div>

        <div class="form-group">
            <label>Единица вместимости</label>
            <input type="text" name="capacity_unit" placeholder="кг, т, шт">
        </div>

        <div class="form-group">
            <label>Стоимость фасовки, руб/т</label>
            <input type="number" step="0.01" name="cost_per_ton" required value="0">
        </div>
    </div>

    <div style="margin-top:20px;">
        <button class="btn" type="submit">Сохранить</button>
        <a href="/packaging-page" style="margin-left:12px;">Отмена</a>
    </div>
</form>
{% endblock %}
