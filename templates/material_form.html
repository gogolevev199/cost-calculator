{% extends "base.html" %}

{% block title %}Добавить материал{% endblock %}

{% block content %}
<h1>Добавить материал</h1>
<p class="muted">Создание новой позиции в справочнике сырья.</p>

<form method="post" action="/materials/new" style="margin-top: 20px;">
    <div class="form-grid">
        <div class="form-group">
            <label>Название</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Код</label>
            <input type="text" name="code">
        </div>

        <div class="form-group">
            <label>Единица измерения</label>
            <input type="text" name="unit" value="t">
        </div>

        <div class="form-group">
            <label>Поставщик</label>
            <input type="text" name="supplier">
        </div>

        <div class="form-group">
            <label>Фракция</label>
            <input type="text" name="fraction">
        </div>

        <div class="form-group">
            <label>Комментарий</label>
            <textarea name="notes" rows="3"></textarea>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button class="btn" type="submit">Сохранить</button>
        <a href="/materials-page" style="margin-left: 12px;">Отмена</a>
    </div>
</form>
{% endblock %}
