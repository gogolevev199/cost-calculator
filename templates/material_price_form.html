{% extends "base.html" %}

{% block title %}Новая цена материала{% endblock %}

{% block content %}
<h1>Новая цена материала</h1>
<p class="muted">Материал: <strong>{{ material.name }}</strong></p>

<form method="post" action="/materials/{{ material.id }}/prices/new" style="margin-top: 20px;">
    <div class="form-grid">
        <div class="form-group">
            <label>Цена</label>
            <input type="number" step="0.01" name="price" required>
        </div>

        <div class="form-group">
            <label>Валюта</label>
            <input type="text" name="currency" value="RUB" required>
        </div>

        <div class="form-group">
            <label>Дата начала действия</label>
            <input type="date" name="valid_from" required>
        </div>

        <div class="form-group">
            <label>Комментарий</label>
            <textarea name="comment" rows="3"></textarea>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button class="btn" type="submit">Сохранить цену</button>
        <a href="/materials/{{ material.id }}/prices" style="margin-left: 12px;">Назад к истории</a>
    </div>
</form>
{% endblock %}
